
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172c24">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
<title>Task Recorder</title>
<link rel="stylesheet" href="style.css?v=7">
<script defer src="jszip.min.js"></script>
<script defer src="workbook.js?v=4"></script>
<script defer src="app.js?v=7"></script>
</head>
<body>
<header class="top"><div class="top-inner">
<a class="brand" href="./"><span class="mark" aria-hidden="true">✓</span>Task Recorder</a>
<div class="toolbar">
<div class="search-control">
<input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search tasks…" aria-label="Search tasks" aria-keyshortcuts="/">
<kbd aria-hidden="true">/</kbd>
</div>
<button id="new" class="outline">New heading</button>
<button id="new-task" class="primary">＋ New task</button>
</div></div></header>
<main class="workspace-layout">
<aside class="workspace-actions" aria-label="Export and backup">
<button id="export" type="button">Export to Excel</button>
<button id="backup" type="button">Backup &amp; Restore</button>
</aside>
<div class="workspace-main">
<section class="intro">
<div><h1 id="title">Work dashboard</h1><p id="subtitle">Organise your work and check off tasks as you go.</p></div>
<div class="totals" id="totals"></div>
</section>
<div class="viewbar">
<nav aria-label="Workspace views"><button id="dashboard" aria-current="page">Dashboard</button><button id="today">Today</button><button id="records">Records</button><button id="weekly">Weekly Summary</button><button id="archived">Archived</button></nav>
<div class="filters">
<select id="heading-filter" aria-label="Filter by heading"></select>
<select id="status-filter" aria-label="Filter by status" hidden><option value="">All statuses</option><option>Pending</option><option>Waiting</option><option>Completed</option></select>
<select id="archive-filter" aria-label="Filter by archive status" hidden><option value="active">Active headings</option><option value="archived">Archived headings</option><option value="all">All headings</option></select>
<button id="clear-filters" class="clear-filters" hidden>Clear filters</button>
<select id="sort" aria-label="Sort records" hidden><option value="added-desc">Added · newest</option><option value="added-asc">Added · oldest</option><option value="completed-desc">Completed · newest</option><option value="completed-asc">Completed · oldest</option></select>
</div>
</div>
<div class="feedback"><p id="notice" role="status"></p><button id="undo" hidden>Undo deletion</button></div>
<section id="content" aria-label="Task workspace"></section>
<p class="small privacy-note">Tasks are stored in this browser. Backups and Excel exports are saved as local downloads.</p>
</div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
<form id="dialog-form" autocomplete="off">
<h2 id="dialog-title"></h2>
<div id="dialog-body"></div>
<div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button class="primary" id="confirm" type="submit">Save</button></div>
</form>
</dialog>
</body>
</html>
