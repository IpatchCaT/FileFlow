<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Drive Uploader · FileFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><a href="../../">FileFlow</a></header>
  <main>
    <h1>Drive Uploader</h1>
    <p>Send files from this browser directly to Google Drive.</p>
    <section aria-labelledby="destination-title">
      <h2 id="destination-title">Google Drive destination</h2>
      <div class="controls">
        <button id="connect">Connect Google Drive</button>
        <span id="account">Account disconnected</span>
      </div>
      <div class="controls">
        <label for="folder">Destination folder</label>
        <select id="folder" disabled><option value="">Connect Google Drive first</option></select>
      </div>
      <form class="controls" id="new-folder">
        <label for="folder-name">New folder name</label>
        <input id="folder-name" required maxlength="200" autocomplete="off" spellcheck="false" disabled>
        <button id="create-folder" disabled>Create folder</button>
      </form>
      <p id="notice" role="status"></p>
    </section>
    <section aria-labelledby="queue-title">
      <h2 id="queue-title">Files</h2>
      <div id="drop">
        <p>Drag and drop files here or use the file picker.</p>
        <label class="file-label" for="files">Choose Files</label>
        <input id="files" type="file" multiple>
      </div>
      <ul id="queue"></ul>
      <div class="controls">
        <button class="primary" id="upload" disabled>Upload to Drive</button>
        <p id="summary" role="status"></p>
      </div>
    </section>
  </main>
</body>
</html>
