<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --line:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; --line:#3a3f47; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  #drop { background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:36px 16px; text-align:center; }
  #drop.over { border-color:var(--accent); }
  #drop p { margin:6px 0; color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
  ul { list-style:none; padding:0; margin:16px 0 0; }
  li { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:.92rem; }
  .top { display:flex; justify-content:space-between; gap:10px; }
  .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { height:5px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
  .ok { color:var(--ok); } .err { color:var(--err); } .wait { color:var(--muted); }
  h2 { font-size:1rem; margin:28px 0 8px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Upload to my Google Drive</h1>
  <div id="drop">
    <button type="button" id="pick">Choose files</button>
    <p>or drag and drop files here</p>
    <input type="file" id="file" multiple hidden>
  </div>
  <ul id="queue"></ul>
  <h2>Recent uploads</h2>
  <ul id="recent"><li class="wait">Loading…</li></ul>
</main>

<script>
  const PARALLEL = 3;          // files uploaded at the same time
  let info = null, infoTime = 0;

  // one quick call to Apps Script for a token + folder id
  function getInfo(force) {
    return new Promise((resolve, reject) => {
      if (!force && info && Date.now() - infoTime < 40 * 60 * 1000) return resolve(info);
      google.script.run
        .withSuccessHandler(i => { info = i; infoTime = Date.now(); resolve(i); })
        .withFailureHandler(reject)
        .getUploadInfo();
    });
  }

  const drop = document.getElementById('drop');
  const input = document.getElementById('file');
  const queue = document.getElementById('queue');
  document.getElementById('pick').onclick = () => input.click();
  input.onchange = () => handle([...input.files]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle([...e.dataTransfer.files]); };

  const size = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

  async function handle(files) {
    input.value = '';
    const jobs = files.map(f => ({ f, row: addRow(f) }));
    let next = 0;
    async function worker() {
      while (next < jobs.length) { const j = jobs[next++]; await upload(j.f, j.row); }
    }
    await Promise.all(Array.from({ length: Math.min(PARALLEL, jobs.length) }, worker));
    loadRecent();
  }

  function addRow(file) {
    const li = document.createElement('li');
    li.innerHTML = '<div class="top"><span class="n"></span><span class="s wait">Waiting…</span></div><div class="bar"><i></i></div>';
    li.querySelector('.n').textContent = file.name + ' (' + size(file.size) + ')';
    queue.prepend(li);
    return { s: li.querySelector('.s'), bar: li.querySelector('.bar i') };
  }

  function setStatus(row, cls, text) { row.s.className = 's ' + cls; row.s.textContent = text; }

  async function upload(file, row, attempt = 0) {
    try {
      setStatus(row, 'wait', 'Starting…');
      const i = await getInfo(attempt > 0);
      // 1) open a resumable upload session straight with Google Drive
      const start = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + i.token,
          'Content-Type': 'application/json; charset=UTF-8',
          'X-Upload-Content-Type': file.type || 'application/octet-stream'
        },
        body: JSON.stringify({ name: file.name, parents: [i.folderId] })
      });
      if (start.status === 401 && attempt < 1) return upload(file, row, attempt + 1);
      if (!start.ok) throw new Error('Start failed (' + start.status + ')');
      const url = start.headers.get('Location');
      if (!url) throw new Error('No upload URL');
      // 2) send the raw file (no base64) and show real progress
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const t0 = Date.now();
        xhr.open('PUT', url);
        xhr.upload.onprogress = e => {
          if (!e.lengthComputable) return;
          const pct = Math.round(e.loaded / e.total * 100);
          row.bar.style.width = pct + '%';
          const sec = (Date.now() - t0) / 1000 || 1;
          setStatus(row, 'wait', pct + '% · ' + size(e.loaded / sec) + '/s');
        };
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('Upload failed (' + xhr.status + ')'));
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send(file);
      });
      row.bar.style.width = '100%';
      setStatus(row, 'ok', 'Saved ✓');
    } catch (err) {
      console.error(err);
      setStatus(row, 'err', 'Failed: ' + err.message);
    }
  }

  // recent list is read straight from Drive too (fast, no Apps Script scan)
  async function loadRecent() {
    const ul = document.getElementById('recent');
    try {
      const i = await getInfo();
      const q = new URLSearchParams({
        q: "'" + i.folderId + "' in parents and trashed=false",
        orderBy: 'createdTime desc', pageSize: '10',
        fields: 'files(id,name,webViewLink)'
      });
      const r = await fetch('https://www.googleapis.com/drive/v3/files?' + q, { headers: { Authorization: 'Bearer ' + i.token } });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      ul.innerHTML = '';
      if (!data.files.length) { ul.innerHTML = '<li class="wait">Nothing yet</li>'; return; }
      data.files.forEach(f => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = f.webViewLink; a.target = '_blank'; a.textContent = f.name;
        li.appendChild(a); ul.appendChild(li);
      });
    } catch (e) {
      console.error(e);
      ul.innerHTML = '<li class="err">Could not load the list. Run getUploadInfo once in the editor and approve permissions.</li>';
    }
  }
  loadRecent();
</script>
</body>
</html>
