<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --line:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; --line:#3a3f47; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  #drop { background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:36px 16px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); }
  #drop p { margin:6px 0; color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
  ul { list-style:none; padding:0; margin:16px 0 0; }
  li { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; font-size:.92rem; }
  li span.n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ok { color:var(--ok); } .err { color:var(--err); } .wait { color:var(--muted); }
  h2 { font-size:1rem; margin:28px 0 8px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Upload to my Google Drive</h1>
  <div id="drop">
    <button type="button" id="pick">Choose files</button>
    <p>or drag and drop files here</p>
    <input type="file" id="file" multiple hidden>
  </div>
  <ul id="queue"></ul>
  <h2>Recent uploads</h2>
  <ul id="recent"><li class="wait">Loading…</li></ul>
</main>

<script>
  const MAX_MB = 30; // Apps Script limit is roughly 50 MB; stay safe
  const drop = document.getElementById('drop');
  const input = document.getElementById('file');
  const queue = document.getElementById('queue');

  document.getElementById('pick').onclick = () => input.click();
  input.onchange = () => handle(input.files);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files); };

  async function handle(files) {
    for (const f of files) await upload(f);
    input.value = '';
    loadRecent();
  }

  function addRow(name) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="n"></span><span class="s wait">Uploading…</span>';
    li.querySelector('.n').textContent = name;
    queue.prepend(li);
    return li.querySelector('.s');
  }

  function upload(file) {
    return new Promise(resolve => {
      const status = addRow(file.name);
      if (file.size > MAX_MB * 1024 * 1024) {
        status.className = 's err'; status.textContent = 'Too big (max ' + MAX_MB + ' MB)';
        return resolve();
      }
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        google.script.run
          .withSuccessHandler(() => { status.className = 's ok'; status.textContent = 'Saved ✓'; resolve(); })
          .withFailureHandler(err => { status.className = 's err'; status.textContent = 'Failed'; console.error(err); resolve(); })
          .saveFile(file.name, file.type, base64);
      };
      reader.onerror = () => { status.className = 's err'; status.textContent = 'Read error'; resolve(); };
      reader.readAsDataURL(file);
    });
  }

  function loadRecent() {
    google.script.run.withSuccessHandler(list => {
      const ul = document.getElementById('recent');
      ul.innerHTML = '';
      if (!list.length) { ul.innerHTML = '<li class="wait">Nothing yet</li>'; return; }
      list.forEach(f => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = f.url; a.target = '_blank'; a.textContent = f.name;
        li.appendChild(a);
        ul.appendChild(li);
      });
    }).recentFiles();
  }
  loadRecent();
</script>
</body>
</html>
